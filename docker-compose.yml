# All persistent data lives in ./var so the whole project can be moved (e.g. to SSD).
# Container logs rotate by size (no request bodies are logged; see docs/privacy-policy.md).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    logging: *logging
    restart: unless-stopped
    env_file: .env
    # Small-footprint settings: RPi RAM is shared with other services.
    command: postgres -c shared_buffers=32MB -c max_connections=20 -c work_mem=2MB
    volumes:
      - ./var/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 192m
    # No published port: DB reachable only from the api container.

  api:
    logging: *logging
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      MAP_SOURCE: ${MAP_SOURCE:-/maps/cz.pmtiles}
      EXTRACTS_DIR: /data/extracts
    volumes:
      - ./maps:/maps:ro
      - ./var/extracts:/data/extracts
    depends_on:
      db:
        condition: service_healthy
    # Bound to localhost only; public access via Cloudflare Tunnel.
    ports:
      - "127.0.0.1:8000:8000"
    mem_limit: 160m
